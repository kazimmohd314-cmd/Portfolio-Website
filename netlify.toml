[build]
  command = "npm run build"
  publish = "dist"

# Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache Astro static assets immutably
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts immutably
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect legacy sitemap to index
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Clean project shortcuts
[[redirects]]
  from = "/studyplanner"
  to = "/projects/studyplanner"
  status = 301

[[redirects]]
  from = "/befit-gym"
  to = "/projects/befit-gym"
  status = 301

[[redirects]]
  from = "/skill1swap"
  to = "/projects/skill1swap"
  status = 301

[[redirects]]
  from = "/skillswap"
  to = "/projects/skill1swap"
  status = 301

# Deprecated legacy projects redirects
[[redirects]]
  from = "/detaltree"
  to = "/"
  status = 301

[[redirects]]
  from = "/qidarcatering"
  to = "/"
  status = 301

# Fallback 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
